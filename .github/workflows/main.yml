name: Deploy Laravel Project on push

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy Only Changed Files
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, json, bcmath, zip
          coverage: none

      - name: 📁 Create Storage Directories & Env
        run: |
          mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions storage/bootstrap/cache bootstrap/cache
          cp .env.example .env || touch .env

      - name: 📦 Install Composer Dependencies (Required for Ziggy)
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist --no-scripts

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: 📂 Sync changed files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: / # আপনার সার্ভারের সঠিক পাথ (যেমন /public_html/ অথবা /)
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            .env
            .env.*
            storage/**
            public/storage/**
            tests/**
